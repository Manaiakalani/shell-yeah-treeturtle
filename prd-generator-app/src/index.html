<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐢🌳 PRD Generator — Trees & Turtles Edition</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-container">
    <!-- HEADER -->
    <header class="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <h1 class="hero-title">
          <span class="emoji-float">🐢</span>
          PRD Generator
          <span class="emoji-float">🌳</span>
        </h1>
        <p class="hero-subtitle">Local trees from your area + random turtle facts = the dopest PRD you've ever seen</p>
        <div class="location-status" id="locationStatus">
          <span class="status-dot"></span>
          <span class="status-text">Click below to detect your location</span>
        </div>
      </div>
    </header>

    <!-- CONTROLS -->
    <section class="controls">
      <div class="controls-row">
        <button class="btn btn-primary" id="detectLocationBtn">
          📍 Detect My Location
        </button>
        <div class="select-wrapper">
          <select id="regionSelect" class="region-select">
            <option value="">— or pick a region —</option>
            <option value="northeast_us">Northeastern US</option>
            <option value="southeast_us">Southeastern US</option>
            <option value="midwest_us">Midwestern US</option>
            <option value="southwest_us">Southwestern US</option>
            <option value="northwest_us">Northwestern US</option>
            <option value="california">California</option>
            <option value="europe_west">Western Europe</option>
            <option value="tropics">Tropical Regions</option>
            <option value="default">Global Favorites</option>
          </select>
        </div>
      </div>
      <div class="controls-row">
        <label class="slider-label">
          Turtle Facts:
          <input type="range" id="turtleCount" min="1" max="10" value="3" class="slider" />
          <span id="turtleCountDisplay" class="slider-value">3</span>
        </label>
        <label class="slider-label">
          Trees:
          <input type="range" id="treeCount" min="1" max="5" value="3" class="slider" />
          <span id="treeCountDisplay" class="slider-value">3</span>
        </label>
      </div>
      <button class="btn btn-generate" id="generateBtn">
        ⚡ Generate PRD
      </button>
    </section>

    <!-- OUTPUT -->
    <section class="output-section" id="outputSection" style="display:none;">
      <div class="output-header">
        <h2>Your PRD</h2>
        <div class="output-actions">
          <button class="btn btn-copy" id="copyMdBtn" title="Copy as Markdown">📋 Copy Markdown</button>
          <button class="btn btn-copy" id="copyTextBtn" title="Copy as Plain Text">📝 Copy Text</button>
        </div>
      </div>
      <div class="prd-preview" id="prdPreview"></div>
      <div class="copy-toast" id="copyToast">Copied to clipboard! 🎉</div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>Built with 🐢 energy & 🌳 vibes — <span id="currentYear"></span></p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
  <script
    src="https://analytics.manaiakalani.info/api/script.js"
    data-site-id="53628c608893"
    defer
  ></script>
</body>
</html>
